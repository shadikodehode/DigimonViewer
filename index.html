<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="https://digi-api.com/favicon.png"> <!--tab icon-->
	<title>Digimon Viewer</title> <!--tab title-->

	<!--styles-->
	
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jersey+10&family=Pixelify+Sans:wght@400..700&family=Silkscreen:wght@400;700&family=Tiny5&family=VT323&display=swap" rel="stylesheet">
	
	
  <script type="module" crossorigin src="/DigimonViewer/assets/index-8Z0pckm7.js"></script>
  <link rel="stylesheet" crossorigin href="/DigimonViewer/assets/index-CAmCT8v7.css">
</head>
<body>
	<div class="header-container"> 
	<div class="header">
		<div class="header-logo">
			<img class="logo" 
				src="/DigimonViewer/assets/Digimon_Logo-Dhj1NEEa.svg" 
				alt="digimon-logo">
		</div>
		<div class="header-searchbar">
		<input 
			list="digimon-names"
			class="searchbar"
			type="text"
			placeholder="SEARCH DIGIMON..."
			inputmode="search">
			<datalist id="digimon-names">
			</datalist>
		</div>
		<div class="header-button">
			<div class="button-container">
				<button class="button-xantibody">
					<div>
						X-Antibody
					</div>
				</button>
			</div>
			<div class="button-container">
				<button class="button-level">
					<div>
						level
					</div>
					<div class="arrow">
						v
					</div>
				</button>
				<div class="button-content-level">
				</div>
			</div>
			<div class="button-container">
				<button class="button-attribute">
					<div>
						attribute
					</div>
					<div class="arrow">
						v
					</div>
				</button>
				<div class="button-content-attribute">
				</div>
			</div>
			<div class="button-container">
				<button class="button-reset">
					X
				</button>
			</div>
			</div>
		</div>
		</div>          
	</div>
	<div class="card-container">
	</div>
</body>
</html>
